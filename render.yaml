services:
  - type: web
    name: ai-travel-planner
    plan: free
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-travel-planner-puce-three.vercel.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
